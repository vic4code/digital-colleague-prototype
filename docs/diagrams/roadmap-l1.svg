<svg viewBox="0 0 840 556" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Level 1 — standalone digital-colleague prototype</title>
  <desc>One process holds every layer. Channels reach the colleague; the colleague container holds authored identity files above an off-the-shelf runtime with an approval gate; tools are official connectors; an observability band feeds a read-only status view.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <style>
    .h1 { font-size: 15px; font-weight: 700; fill: #111827; }
    .label { font-size: 12px; font-weight: 600; fill: #111827; }
    .labelS { font-size: 11px; font-weight: 600; fill: #111827; }
    .sub { font-size: 10.5px; fill: #6b7280; }
    .port { font-size: 10px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .tier { font-size: 10.5px; font-weight: 700; fill: #4b5563; letter-spacing: 0.4px; }
    .own { font-size: 9px; font-weight: 700; fill: #c2410c; font-family: ui-monospace, monospace; }
    .sec { font-size: 9px; font-weight: 700; fill: #1d4ed8; font-family: ui-monospace, monospace; }
    .edge { stroke: #9ca3af; stroke-width: 1.3; fill: none; }
    .edgeB { stroke: #2563eb; stroke-width: 1.3; fill: none; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .container { fill: #fafafa; stroke: #d1d5db; stroke-width: 1.2; }
    .own1 { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.3; }
    .human { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.4; }
    .secband { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.4; }
    .chip { fill: #fff7ed; stroke: #fdba74; stroke-width: 0.9; }
    .chipB { fill: #dbeafe; stroke: #93c5fd; stroke-width: 0.9; }
  </style>

  <rect width="840" height="556" fill="#ffffff"/>
  <text x="24" y="26" class="h1">Level 1 — standalone prototype (one process)</text>
  <text x="24" y="44" class="sub">Orange = we author · Blue = human surface &amp; approval/security · Grey = off-the-shelf runtime &amp; connectors.</text>

  <!-- EDGE -->
  <text x="24" y="74" class="tier">EDGE · CHANNELS</text>
  <rect x="24" y="84" width="150" height="50" rx="8" class="box"/>
  <text x="99" y="106" text-anchor="middle" class="labelS">console</text>
  <text x="99" y="121" text-anchor="middle" class="sub">local / diagnostic</text>
  <rect x="186" y="84" width="220" height="50" rx="8" class="human"/>
  <text x="296" y="106" text-anchor="middle" class="labelS">web · text / voice</text>
  <text x="296" y="121" text-anchor="middle" class="sub">the approved human surface</text>
  <rect x="420" y="84" width="220" height="50" rx="8" class="box"/>
  <text x="530" y="106" text-anchor="middle" class="labelS">Gmail · Slack</text>
  <text x="530" y="121" text-anchor="middle" class="sub">official Codex connectors</text>

  <line x1="296" y1="134" x2="296" y2="168" class="edgeB" marker-end="url(#arrB)"/>

  <!-- COLLEAGUE -->
  <text x="24" y="160" class="tier">DIGITAL COLLEAGUE · AUTHORED IDENTITY + OFF-THE-SHELF RUNTIME</text>
  <rect x="24" y="170" width="792" height="208" rx="10" class="container"/>
  <rect x="38" y="182" width="66" height="14" rx="7" class="chip"/>
  <text x="46" y="192" class="own">WE AUTHOR</text>

  <rect x="40" y="200" width="120" height="44" rx="6" class="own1"/>
  <text x="100" y="219" text-anchor="middle" class="labelS">person.yaml</text>
  <text x="100" y="234" text-anchor="middle" class="sub">role · mandate</text>
  <rect x="168" y="200" width="120" height="44" rx="6" class="own1"/>
  <text x="228" y="219" text-anchor="middle" class="labelS">SOUL.md</text>
  <text x="228" y="234" text-anchor="middle" class="sub">persona · tone</text>
  <rect x="296" y="200" width="120" height="44" rx="6" class="own1"/>
  <text x="356" y="219" text-anchor="middle" class="labelS">info.yaml</text>
  <text x="356" y="234" text-anchor="middle" class="sub">accounts</text>
  <rect x="424" y="200" width="120" height="44" rx="6" class="own1"/>
  <text x="484" y="219" text-anchor="middle" class="labelS">skills/</text>
  <text x="484" y="234" text-anchor="middle" class="sub">plugins</text>
  <rect x="552" y="200" width="120" height="44" rx="6" class="own1"/>
  <text x="612" y="219" text-anchor="middle" class="labelS">memory/</text>
  <text x="612" y="234" text-anchor="middle" class="sub">JSONL log</text>
  <rect x="680" y="200" width="120" height="44" rx="6" class="own1"/>
  <text x="740" y="219" text-anchor="middle" class="labelS">policies/</text>
  <text x="740" y="234" text-anchor="middle" class="sub">safety-boundary</text>

  <rect x="40" y="252" width="760" height="36" rx="6" class="box"/>
  <text x="52" y="268" class="labelS">Intake + dispatch</text>
  <text x="52" y="281" class="sub">single Turn path · per-thread serialization · recalls memory</text>
  <rect x="40" y="294" width="760" height="36" rx="6" class="secband"/>
  <text x="52" y="310" class="labelS">Approval gate</text>
  <text x="52" y="323" class="sub">awaiting_approval · every external write needs fresh human approval</text>
  <rect x="40" y="336" width="760" height="36" rx="6" class="box"/>
  <text x="52" y="352" class="labelS">Agent runtime — Codex app-server</text>
  <text x="52" y="365" class="sub">thread / turn lifecycle · MCP client · streamed events</text>

  <line x1="380" y1="378" x2="380" y2="406" class="edge" marker-end="url(#arr)"/>
  <text x="392" y="397" class="port">read (auto) · write (approved)</text>

  <!-- TOOLS -->
  <text x="24" y="426" class="tier">TOOLS · OFFICIAL CONNECTORS — read-mostly; writes approval-gated</text>
  <rect x="24" y="436" width="128" height="40" rx="6" class="box"/>
  <text x="88" y="461" text-anchor="middle" class="sub">Gmail</text>
  <rect x="160" y="436" width="128" height="40" rx="6" class="box"/>
  <text x="224" y="461" text-anchor="middle" class="sub">Outlook</text>
  <rect x="296" y="436" width="128" height="40" rx="6" class="box"/>
  <text x="360" y="461" text-anchor="middle" class="sub">Calendar</text>
  <rect x="432" y="436" width="128" height="40" rx="6" class="box"/>
  <text x="496" y="461" text-anchor="middle" class="sub">Slack</text>
  <rect x="568" y="436" width="120" height="40" rx="6" class="box"/>
  <text x="628" y="461" text-anchor="middle" class="sub">Notion</text>
  <rect x="696" y="436" width="120" height="40" rx="6" class="box"/>
  <text x="756" y="461" text-anchor="middle" class="sub">Teams · …</text>

  <!-- OBSERVABILITY -->
  <text x="24" y="502" class="tier">OBSERVABILITY · read-only</text>
  <rect x="24" y="512" width="792" height="34" rx="8" class="container"/>
  <text x="36" y="533" class="sub">Event store → web status view · task cards (received → triaging → awaiting_approval → …) · append-only log</text>
</svg>
