<svg viewBox="0 0 840 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Level 2 — Agent Hub / AI workstation</title>
  <desc>The single process is decomposed into a first-class control plane: task queue, controller, a unified policy and approval engine, and cost metering, over an execution layer and shared services, feeding a status view and approvals inbox.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  </defs>
  <style>
    .h1 { font-size: 15px; font-weight: 700; fill: #111827; }
    .label { font-size: 12px; font-weight: 600; fill: #111827; }
    .labelS { font-size: 11px; font-weight: 600; fill: #111827; }
    .sub { font-size: 10.5px; fill: #6b7280; }
    .port { font-size: 10px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .tier { font-size: 10.5px; font-weight: 700; fill: #4b5563; letter-spacing: 0.4px; }
    .own { font-size: 9px; font-weight: 700; fill: #c2410c; font-family: ui-monospace, monospace; }
    .sec { font-size: 9px; font-weight: 700; fill: #1d4ed8; font-family: ui-monospace, monospace; }
    .edge { stroke: #9ca3af; stroke-width: 1.3; fill: none; }
    .edgeB { stroke: #2563eb; stroke-width: 1.3; fill: none; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .container { fill: #fafafa; stroke: #d1d5db; stroke-width: 1.2; }
    .own1 { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.3; }
    .human { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.4; }
    .secband { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.4; }
    .chip { fill: #fff7ed; stroke: #fdba74; stroke-width: 0.9; }
    .chipB { fill: #dbeafe; stroke: #93c5fd; stroke-width: 0.9; }
  </style>

  <rect width="840" height="580" fill="#ffffff"/>
  <text x="24" y="26" class="h1">Level 2 — Agent Hub / AI workstation</text>
  <text x="24" y="44" class="sub">Governance becomes a first-class control plane. Orange = authored policy · Blue = security/human · Grey = off-the-shelf.</text>

  <!-- EDGE -->
  <text x="24" y="74" class="tier">EDGE · CHANNELS + PROACTIVE TRIGGERS</text>
  <rect x="24" y="84" width="384" height="48" rx="8" class="box"/>
  <text x="36" y="104" class="labelS">Channels + inbound events</text>
  <text x="36" y="119" class="sub">Gmail · Teams · Slack · Calendar · Notion</text>
  <rect x="420" y="84" width="396" height="48" rx="8" class="box"/>
  <text x="432" y="104" class="labelS">Scheduler / triggers</text>
  <text x="432" y="119" class="sub">proactive · persistent · continuous execution</text>

  <line x1="420" y1="132" x2="420" y2="162" class="edgeB" marker-end="url(#arrB)"/>

  <!-- CONTROL PLANE -->
  <text x="24" y="156" class="tier">CONTROL PLANE · AGENT HUB</text>
  <rect x="24" y="166" width="792" height="96" rx="10" class="container"/>
  <rect x="38" y="178" width="156" height="14" rx="7" class="chipB"/>
  <text x="46" y="188" class="sec">RBAC · POLICY · APPROVAL</text>
  <rect x="40" y="198" width="184" height="52" rx="6" class="box"/>
  <text x="52" y="217" class="labelS">Task queue</text>
  <text x="52" y="232" class="sub">intake · persistence</text>
  <text x="52" y="245" class="sub">continuity</text>
  <rect x="232" y="198" width="184" height="52" rx="6" class="own1"/>
  <text x="244" y="217" class="labelS">Controller</text>
  <text x="244" y="232" class="sub">who-can-task</text>
  <text x="244" y="245" class="sub">reply policy</text>
  <rect x="424" y="198" width="184" height="52" rx="6" class="secband"/>
  <text x="436" y="217" class="labelS">Policy &amp; Approval Engine</text>
  <text x="436" y="232" class="sub">RBAC · risk-tier</text>
  <text x="436" y="245" class="sub">approval workflow</text>
  <rect x="616" y="198" width="184" height="52" rx="6" class="box"/>
  <text x="628" y="217" class="labelS">Cost meter</text>
  <text x="628" y="232" class="sub">budgets · ceilings</text>
  <text x="628" y="245" class="sub">per turn / tool</text>

  <line x1="420" y1="262" x2="420" y2="290" class="edge" marker-end="url(#arr)"/>
  <text x="432" y="281" class="port">dispatch · tier-gated tool call</text>

  <!-- EXECUTION -->
  <text x="24" y="310" class="tier">EXECUTION</text>
  <rect x="24" y="320" width="384" height="46" rx="8" class="box"/>
  <text x="36" y="340" class="labelS">Agent runtime — Codex</text>
  <text x="36" y="355" class="sub">one turn · MCP client · streamed events</text>
  <rect x="420" y="320" width="396" height="46" rx="8" class="box"/>
  <text x="432" y="340" class="labelS">Connector / skill registry</text>
  <text x="432" y="355" class="sub">fast onboarding of internal systems / platforms</text>

  <!-- SHARED SERVICES -->
  <text x="24" y="386" class="tier">SHARED SERVICES</text>
  <rect x="24" y="396" width="190" height="44" rx="6" class="box"/>
  <text x="119" y="415" text-anchor="middle" class="labelS">Long-term memory</text>
  <text x="119" y="430" text-anchor="middle" class="sub">retrieval · learning</text>
  <rect x="222" y="396" width="190" height="44" rx="6" class="box"/>
  <text x="317" y="415" text-anchor="middle" class="labelS">RBAC + policy store</text>
  <text x="317" y="430" text-anchor="middle" class="sub">roles · per-tool policy</text>
  <rect x="420" y="396" width="190" height="44" rx="6" class="box"/>
  <text x="515" y="415" text-anchor="middle" class="labelS">Audit</text>
  <text x="515" y="430" text-anchor="middle" class="sub">append-only</text>
  <rect x="618" y="396" width="198" height="44" rx="6" class="box"/>
  <text x="717" y="415" text-anchor="middle" class="labelS">Release / review pipeline</text>
  <text x="717" y="430" text-anchor="middle" class="sub">launch · iterate · retire</text>

  <!-- TOOLS -->
  <text x="24" y="462" class="tier">TOOLS · CONNECTORS — tier-gated CRUD</text>
  <rect x="24" y="472" width="128" height="38" rx="6" class="box"/>
  <text x="88" y="496" text-anchor="middle" class="sub">Gmail</text>
  <rect x="160" y="472" width="128" height="38" rx="6" class="box"/>
  <text x="224" y="496" text-anchor="middle" class="sub">Outlook</text>
  <rect x="296" y="472" width="128" height="38" rx="6" class="box"/>
  <text x="360" y="496" text-anchor="middle" class="sub">Calendar</text>
  <rect x="432" y="472" width="128" height="38" rx="6" class="box"/>
  <text x="496" y="496" text-anchor="middle" class="sub">Slack</text>
  <rect x="568" y="472" width="120" height="38" rx="6" class="box"/>
  <text x="628" y="496" text-anchor="middle" class="sub">Notion</text>
  <rect x="696" y="472" width="120" height="38" rx="6" class="box"/>
  <text x="756" y="496" text-anchor="middle" class="sub">Teams · …</text>

  <!-- HUMAN OVERSIGHT -->
  <text x="24" y="536" class="tier">HUMAN OVERSIGHT</text>
  <rect x="24" y="546" width="792" height="26" rx="7" class="secband"/>
  <text x="36" y="563" class="sub">Status view + approvals inbox · T2 writes park as awaiting_approval until a human approves the exact target</text>
</svg>
